[project]
name = "mcp-ocr"
version = "0.1.0"
description = "MCP Server for OCR using Qwen2-VL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "mlx-vlm",
    "pillow",
    "pdf2image",
]

[project.scripts]
mcp-ocr = "mcp_ocr.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
